<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="Minecraft 1.30 隱藏更新流出：末地與深淵">
    <meta property="og:description" content="點擊觀看官方未公開的開發者演示影片，搶先看全新維度與生物。">
    <meta property="og:image" content="https://github.com/owo-url/owo-url/blob/main/minecraft.png?raw=true">
    <meta property="og:type" content="website">
    
    <title>Minecraft Secret Update - Early Access</title>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #1a1a1a; color: #f0f0f0; margin: 0; padding-top: 50px; }
        
        .description-box { max-width: 800px; margin: 0 auto; padding: 20px; background: #2d2d2d; border: 2px solid #3c8527; border-radius: 8px; }
        h1 { color: #52e132; text-shadow: 2px 2px #000; }
        
        .video-container { 
            position: relative; 
            padding-bottom: 56.25%; 
            height: 0; 
            overflow: hidden; 
            max-width: 1000px; 
            margin: 30px auto; 
            background: #000;
            border: 5px solid #555;
        }

        .video-container iframe { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; 
        }

        #fake-cover {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000 url('https://github.com/owo-url/owo-url/blob/main/minecraft.png?raw=true') no-repeat center center;
            background-size: cover;
            z-index: 10;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-button {
            width: 80px;
            height: 80px;
            background: rgba(60, 133, 39, 0.9);
            border: 4px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .play-button:hover { transform: scale(1.1); }
        .play-button::after {
            content: '';
            border-style: solid;
            border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent white;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <h1>Minecraft: The Abyss Update (Early Access)</h1>
    <div class="description-box">
        <h3>探索前所未見的全新生態域</h3>
        <p>
            Mojang 官方團隊流出的最新內部測試片段。本次更新將包含全新的<strong>「深淵維度」</strong>、
            改良後的<strong>末地堡壘</strong>以及玩家期待已久的<strong>紅石自動合成器 2.0</strong>。
            請點擊下方播放器，搶先觀看全球首發的實機演示影片。
        </p>
    </div>

    <div class="video-container">
        <div id="fake-cover">
            <div class="play-button"></div>
        </div>

        <iframe id="rick-video" width="1120" height="630"
            src="https://www.youtube.com/embed/dQw4w9WgXcQ?si=c9Qs0fPdWYcMx-RO&amp&mute=1&autoplay=1&loop=1&playlist=dQw4w9WgXcQ&enablejsapi=1;controls=0" 
            title="Minecraft Update Leak"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        document.getElementById('fake-cover').addEventListener('click', function() {
            const iframe = document.getElementById('rick-video');
            
            // 解除靜音並播放
            iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
            iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            
            this.style.display = 'none';
            
            // 揭穿惡作劇
            document.querySelector('h1').innerText = "你被苦力怕炸了！(以及 Rickroll'd)";
            document.querySelector('p').innerText = "永遠不要相信網路上的「開發者版本」連結，祝你有個愉快的一天！";
        });
    </script>
</body>
</html>
