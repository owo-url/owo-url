<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Minecraft 1.30 隱藏更新流出：末地與深淵">
    <meta property="og:description" content="點擊觀看官方未公開的開發者演示影片。">
    <meta property="og:image" content="https://github.com/owo-url/owo-url/blob/main/minecraft.png?raw=true">
    
    <title>Minecraft Secret Update</title>

    <style>
        body { font-family: sans-serif; text-align: center; background-color: #1a1a1a; color: #f0f0f0; margin: 0; padding-top: 50px; }
        .description-box { max-width: 600px; margin: 0 auto; padding: 20px; background: #2d2d2d; border: 2px solid #3c8527; border-radius: 8px; }
        h1 { color: #52e132; }
        
        .video-container { 
            position: relative; 
            width: 90%; max-width: 700px; 
            aspect-ratio: 16 / 9; 
            margin: 20px auto; 
            background: #000;
        }

        /* 影片預設靜音、隱藏，並在後台跑 */
        #rick-video { 
            width: 100%; height: 100%; 
            display: block;
            visibility: hidden; /* 預載時先隱藏 */
        }

        #fake-cover {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://github.com/owo-url/owo-url/blob/main/minecraft.png?raw=true') center/cover;
            z-index: 10;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .play-button {
            width: 70px; height: 70px;
            background: rgba(60, 133, 39, 0.9);
            border-radius: 50%;
            border: 3px solid white;
        }
        .play-button::after {
            content: ''; display: inline-block; margin: 20px 0 0 5px;
            border-style: solid; border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent white;
        }
    </style>
</head>
<body>

    <h1>Minecraft: The Abyss Update</h1>
    <div class="description-box">
        <p>官方 1.30 版本開發者演示影片</p>
    </div>

    <div class="video-container">
        <div id="fake-cover"><div class="play-button"></div></div>

        <video id="rick-video" preload="auto" loop playsinline muted autoplay>
            <source src="https://files.catbox.moe/o5x3xg.mp4" type="video/mp4"> 
            </video>
    </div>

    <script>
        // 更換為極速 Rickroll 連結 (由 Discord CDN 或是高效能伺服器提供)
        const rickUrl = "https://files.catbox.moe/p996f0.mp4"; 
        document.querySelector('source').src = rickUrl;
        document.getElementById('rick-video').load();

        const fakeCover = document.getElementById('fake-cover');
        const video = document.getElementById('rick-video');

        fakeCover.addEventListener('click', function() {
            // 點擊瞬間：顯示影片、解除靜音、從頭播放
            video.style.visibility = 'visible';
            video.muted = false;
            video.currentTime = 0;
            video.play();
            
            this.style.display = 'none';
            document.querySelector('h1').innerText = "Boom! 你被炸了！";
        });
    </script>
</body>
</html>
